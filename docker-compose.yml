services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yap
      POSTGRES_PASSWORD: yap
      POSTGRES_DB: yap
    ports:
      - "5433:5432"
    volumes:
      - yap_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  yap_pgdata: