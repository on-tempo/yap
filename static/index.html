<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YAP</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    #log { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
    .line { padding: 2px 0; }
    .system { color: #888; font-style: italic; }
    input { padding: 8px; font-size: 15px; }
    .full { width: 100%; box-sizing: border-box; }
    button { padding: 8px 16px; font-size: 15px; margin-left: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [username, setUsername] = useState("");
  const [connected, setConnected] = useState(false);
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");
  const wsRef = useRef(null);          // keep the socket out of render state
  const logRef = useRef(null);

  // auto-scroll whenever a new message arrives
  useEffect(() => {
    if (logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [messages]);

  function connect() {
    const name = username.trim();
    if (!name) return;

    // same host as the page, so this works locally and when deployed over HTTPS
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(
      `${protocol}//${location.host}/ws?username=${encodeURIComponent(name)}`
    );

    ws.onopen = () => {
      setConnected(true);
      setMessages((prev) => [...prev, `[system] connected as ${name}`]);
    };
    ws.onmessage = (e) => {
      setMessages((prev) => [...prev, e.data]);
    };
    ws.onclose = () => {
      setConnected(false);
      setMessages((prev) => [...prev, "[system] disconnected"]);
    };

    wsRef.current = ws;
  }

  function send(e) {
    if (e.key !== "Enter") return;
    const text = draft.trim();
    if (!text || !wsRef.current) return;
    wsRef.current.send(text);
    setDraft("");
  }

  if (!connected) {
    return (
      <div>
        <h1>YAP</h1>
        <input
          value={username}
          onChange={(e) => setUsername(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && connect()}
          placeholder="username"
          autoFocus
        />
        <button onClick={connect}>connect</button>
      </div>
    );
  }

  return (
    <div>
      <h1>YAP</h1>
      <div id="log" ref={logRef}>
        {messages.map((m, i) => (
          <div key={i} className={"line" + (m.startsWith("[system]") ? " system" : "")}>
            {m}
          </div>
        ))}
      </div>
      <input
        className="full"
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onKeyDown={send}
        placeholder="type a message, or /join room, #room hi, @user hi"
        autoFocus
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
